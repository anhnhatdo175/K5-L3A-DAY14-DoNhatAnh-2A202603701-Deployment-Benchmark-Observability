# Railway — build từ Dockerfile, healthcheck /health.
# App lắng nghe theo biến PORT do Railway cấp (CMD trong Dockerfile dùng ${PORT:-8000}).
# Secret (AGENT_API_KEY) và REDIS_URL đặt bằng `railway variables`, không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
